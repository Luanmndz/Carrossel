<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/biblioteca.css">
    <title> Biblioteca </title>
</head>
<body>
    <div class="container">
        <h2> Cadastrar Livro </h2>
        <input type="text" placeholder="Titulo" id="titulo">
        <input type="text" placeholder="Autor" id="autor">
        <input type="text" placeholder="Ano" id="ano">
        <input type="text" placeholder="Gênero" id="genero">

        <button id ="btnCadastrar">
            Cadastrar
        </button>

        <hr>

        <h2> Pesquisar Livros </h2>
        <input type="text" id="busca" placeholder="Digite o título">
        <hr>

        <h2> Estante </h2>
        <div id ="estante">


        </div>
        
    </div>
</body>
</html>
